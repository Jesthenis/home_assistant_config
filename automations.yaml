# ==============================================================================
# BADEZIMMER LICHTAUTOMATIK
# Steuert die Beleuchtung basierend auf Bewegung, Sonnenstand und Raumhelligkeit.
# Fasst Ein- und Ausschalten durch Trigger-IDs in einer Automation zusammen.
# ==============================================================================
- id: 'badezimmer_lichtautomatik'
  alias: Badezimmer_Lichtautomatik
  description: 'Automatische Lichtsteuerung Bad (Bewegung, Sonne, Lux)'
  triggers:
  # --- AUSLÖSER 1: Bewegung erkannt ---
  - trigger: motion.detected
    target:
      device_id: [DEVICE_ID_BEWEGUNGSMELDER_BAD]
    options:
      behavior: each
    id: motion_on
  # --- AUSLÖSER 2: Keine Bewegung mehr ---
  - trigger: motion.cleared
    target:
      device_id: [DEVICE_ID_BEWEGUNGSMELDER_BAD]
    options:
      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 30 # Verzögerung, um unnötiges Schalten zu verhindern
    id: motion_off
  conditions: []
  actions:
  - choose:
    # --- OPTION 1: Einschalten (nur bei Dunkelheit) ---
    - conditions:
      - condition: sun.is_set
        options: {}
      - condition: illuminance.is_value
        target:
          device_id: [DEVICE_ID_LICHTSENSOR_BAD]
        options:
          behavior: any
          threshold:
            type: below
            value:
              active_choice: number
              number: 30 # Schwellenwert: Licht geht nur an, wenn es dunkler als 30 Lux ist
      - condition: trigger
        id:
        - motion_on
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          device_id: [DEVICE_ID_LICHTSCHALTER_BAD]
        data: {}
    # --- OPTION 2: Ausschalten (unabhängig von Helligkeit) ---
    - conditions:
      - condition: trigger
        id:
        - motion_off
      sequence:
      - action: switch.turn_off
        metadata: {}
        target:
          device_id: [DEVICE_ID_LICHTSCHALTER_BAD]
        data: {}
  mode: single

# ==============================================================================
# GANG LICHTAUTOMATIK
# Schaltet das Licht im Flur nach Sonnenuntergang bei Präsenz ein.
# ==============================================================================
- id: 'gang_lichtautomatik'
  alias: Gang_Lichtautomation
  description: 'Automatische Lichtsteuerung Flur (Bewegung, Sonne)'
  triggers:
  - trigger: motion.detected
    target:
      device_id: [DEVICE_ID_BEWEGUNGSMELDER_GANG]
    options:
      behavior: each
    id: motion_on
  - trigger: motion.cleared
    target:
      device_id: [DEVICE_ID_BEWEGUNGSMELDER_GANG]
    options:
      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 30
    id: motion_off
  conditions: []
  actions:
  - choose:
    # --- OPTION 1: Einschalten ---
    - conditions:
      - condition: trigger
        id:
        - motion_on
      - condition: sun.is_set # Licht wird nur geschaltet, wenn die Sonne untergegangen ist
        options: {}
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          device_id: [DEVICE_ID_LICHTSCHALTER_GANG]
        data: {}
    # --- OPTION 2: Ausschalten ---
    - conditions:
      - condition: trigger
        id:
        - motion_off
      sequence:
      - action: switch.turn_off
        metadata: {}
        target:
          device_id: [DEVICE_ID_LICHTSCHALTER_GANG]
        data: {}
  mode: single

# ==============================================================================
# WALLPANEL SMART CHARGING
# Akkuschonende Ladesteuerung für das Wand-Tablet. 
# Hält die Ladung zwischen 20% und 80%, um die Lebensdauer des Akkus zu maximieren.
# ==============================================================================
- id: 'wallpanel_ladeautomatik'
  alias: Wallpanel_Ladeautomatik
  description: 'Smart Charging für Dashboard-Tablet (20-80%)'
  triggers:
  # --- Ladevorgang starten ---
  - trigger: numeric_state
    entity_id:
    - sensor.fire_tablet_batterie
    below: 20
    id: charge_start
  # --- Ladevorgang stoppen ---
  - trigger: numeric_state
    entity_id:
    - sensor.fire_tablet_batterie
    above: 80
    id: charge_stop
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - charge_start
      sequence:
      - action: switch.turn_on
        metadata: {}
        target:
          device_id: [DEVICE_ID_STECKDOSE_TABLET]
        data: {}
    - conditions:
      - condition: trigger
        id:
        - charge_stop
      sequence:
      - action: switch.turn_off
        metadata: {}
        target:
          device_id: [DEVICE_ID_STECKDOSE_TABLET]
        data: {}
  mode: single
